version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crestline-capital
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./public:/app/public:ro
      - ./node_modules:/app/node_modules:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crestline-network

  postgres:
    image: postgres:15-alpine
    container_name: crestline-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-crestline}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crestline123}
      - POSTGRES_DB=${POSTGRES_DB:-crestline_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crestline}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crestline-network

  redis:
    image: redis:7-alpine
    container_name: crestline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - crestline-network

volumes:
  postgres_data:
  redis_data:

networks:
  crestline-network:
    driver: bridge