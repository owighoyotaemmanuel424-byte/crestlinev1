name: Crestline Capital CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/crestlinev1_ci?schema=public
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/crestlinev1_ci?schema=public

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Prisma validate
        run: pnpm exec prisma validate
      
      - name: Prisma generate
        run: pnpm exec prisma generate
      
      - name: Run linting
        run: pnpm lint
      
      - name: Run type checking
        run: pnpm type-check
      
      - name: Run unit tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./dev.db
          JWT_SECRET: test-secret-key
          ENCRYPTION_KEY: test-encryption-key
          NEXT_PUBLIC_PROVIDER_MODE: sandbox

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Prisma generate
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: file:./dev.db
      
      - name: Build application
        run: pnpm build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crestline-build
          path: .next/
          retention-days: 7
